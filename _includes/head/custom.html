<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<script>
  // Force dark mode - try all possible al-folio dark mode mechanisms
  localStorage.setItem("theme", "dark");
  localStorage.setItem("darkMode", "true");
  document.documentElement.setAttribute("data-theme", "dark");
  document.documentElement.setAttribute("data-bs-theme", "dark");
  document.documentElement.classList.add("dark");

  document.addEventListener("DOMContentLoaded", function () {
    document.body.setAttribute("data-theme", "dark");
    document.body.classList.add("dark-mode");
    document.body.classList.add("dark");

    // Remove search and dark mode toggle from navbar
    var toRemove = [
      document.getElementById("search-icon"),
      document.getElementById("search-toggle"),
      document.getElementById("dark-mode-toggle"),
      document.querySelector("[data-toggle='search']"),
    ];
    toRemove.forEach(function (el) {
      if (el) {
        var li = el.closest("li") || el.parentElement;
        if (li) li.remove();
        else el.remove();
      }
    });

    document.querySelectorAll(".navbar li").forEach(function (li) {
      if (li.querySelector(".fa-magnifying-glass, .fa-search, .fa-moon, .fa-sun")) {
        li.remove();
      }
    });
  });
</script>
